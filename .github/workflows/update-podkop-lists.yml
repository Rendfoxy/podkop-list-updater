name: Update Podkop Lists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-podkop-lists
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python files
        run: python3 -m py_compile scripts/build_podkop_lists.py tests/test_build_podkop_lists.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build lists
        env:
          CERTSPOTTER_API_TOKEN: ${{ secrets.CERTSPOTTER_API_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: python3 scripts/build_podkop_lists.py

      - name: Prepare release metadata
        id: release_meta
        run: |
          stamp="$(date -u +'%Y%m%d-%H%M%S')"
          msk_name="$(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M MSK')"
          echo "tag=lists-${stamp}" >> "$GITHUB_OUTPUT"
          echo "name=Podkop Lists ${msk_name}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit_changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ config/
          git commit -m "chore: update podkop lists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        if: steps.commit_changes.outputs.changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "src/*.lst,src/*.json"
          body: |
            Generated Podkop domain and subnet lists.

            Files:
            - podkop-russia-domains.lst / .json
            - podkop-russia-subnets.lst / .json
            - podkop-foreign-domains.lst / .json
            - podkop-foreign-subnets.lst / .json
            - manifest.json
          makeLatest: true
          name: ${{ steps.release_meta.outputs.name }}
          tag: ${{ steps.release_meta.outputs.tag }}
