name: Update Podkop Lists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python files
        run: python3 -m py_compile scripts/build_podkop_lists.py tests/test_build_podkop_lists.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build lists
        env:
          CERTSPOTTER_API_TOKEN: ${{ secrets.CERTSPOTTER_API_TOKEN }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: python3 scripts/build_podkop_lists.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ config/
          git commit -m "chore: update podkop lists"
          git push

      - name: Publish release assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "src/*.lst,src/*.json"
          body: |
            Latest generated Podkop domain and subnet lists.

            Files:
            - podkop-russia-domains.lst / .json
            - podkop-russia-subnets.lst / .json
            - podkop-foreign-domains.lst / .json
            - podkop-foreign-subnets.lst / .json
            - manifest.json
          makeLatest: true
          name: Latest Podkop Lists
          replacesArtifacts: true
          tag: latest
